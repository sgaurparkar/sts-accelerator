# OPTIONAL. The pipeline needs NOTHING in this file to run — by default
# src/planner/table_planner.py discovers every table under the schemas
# listed in settings.yaml (source.schemas), reads its primary key straight
# from SQL Server, and defaults every table's load_mode to "full".
#
#   load_mode  -> "full" (default) means this table is picked up by
#                 migration_dag.py / a manual `python main.py --table X`
#                 run. "incremental" means it's picked up by
#                 incremental_dag.py's schedule instead, to periodically
#                 re-check for newly appended rows.
#
# Every load — full or incremental — is INSERT-ONLY: the source data is
# static (existing rows never change), so there is no watermark column
# anywhere in this pipeline. The MERGE matches purely on primary key;
# rows already present in the target are left untouched, only new rows
# get inserted. See src/bigquery/bq_merge.py.
#
# No BigQuery partitioning or clustering is applied to migrated tables —
# target and staging tables are created as plain tables.
#
# Use this file only to force a specific table's load_mode, or to
# exclude a table from the pipeline entirely. Every field is optional
# except `name`; anything you don't set keeps its auto-detected default.
#
# `schema` is optional too. Set it when the same table name exists in
# more than one schema and you only want the override to apply to one
# of them; leave it out and the override applies to that table name in
# every schema (a schema-specific entry always wins over a schema-less
# one for the same name).
#
# overrides:
#   - name: orders
#     load_mode: incremental
#   - name: orders
#     schema: sales
#     load_mode: full            # sales.orders stays full even though dbo.orders (above) is incremental
#   - name: staging_scratch_table
#     exclude: true

overrides: []

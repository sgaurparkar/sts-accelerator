# Central configuration for the accelerator.
# There is NO per-table list here anymore — table names, columns and
# primary keys are all discovered dynamically at runtime straight from
# SQL Server (src/discovery/table_discovery.py). Connection secrets go
# in .env (see .env.example) — never here.

source:
  type: mssql                      # only mssql is supported
  host: sql-to-gcp-poc-server2.database.windows.net   # fallback only — overridden by --region (see `regions:` below)
  database: sales_poc                                  # same database name on every regional server unless a region sets its own
  driver: "ODBC Driver 18 for SQL Server"
  schemas: []                      # which SQL Server schemas to discover tables from.
                                    # Leave empty ([]) to auto-discover EVERY schema that
                                    # owns at least one base table, straight off SQL Server
                                    # (system/security schemas excluded) — this is what makes
                                    # `python main.py --all` cover every schema with zero
                                    # config change. Set an explicit list (e.g. [dbo, sales])
                                    # to scope the pipeline to only those schemas instead.
                                    # Each schema gets its own BigQuery dataset — see
                                    # gcp.bq_dataset below.
  # username/password are read from .env as AZURE_SQL_USERNAME / AZURE_SQL_PASSWORD

# One Azure SQL server per Azure region. The key is the region name exactly as
# Azure shows it; pick one at run time with  --region "<name>"  (case, spaces
# and hyphens are ignored, so "east us" / "East-US" / "eastus" all work).
# Replace each <...> placeholder with that region's real server FQDN
# (Azure portal -> SQL server -> Overview -> "Server name").
# gcp_location = GCP region used for that Azure region's GCS bucket + BigQuery
# datasets (closest match; change if you prefer another).
# Per region, GCP is separated automatically:
#   bucket        <gcp.gcs_bucket>-<region>      e.g. migration-landing-bucket-east-us
#   control ds    <gcp.bq_dataset>_<region>      e.g. migrated_data_east_us   (checkpoint/audit/logs/report)
#   data datasets <region>_<schema>              e.g. east_us_dbo, east_us_sales
# Required per region: host, gcp_location.
# Optional per region: database, storage_account, gcs_bucket, bq_dataset (override the names above).
# Credentials: shared AZURE_SQL_USERNAME/PASSWORD in .env, or AZURE_SQL_USERNAME_<REGION>/..._PASSWORD_<REGION>
# (e.g. _EAST_US) when a region's server has its own login — see .env.example.
regions:
  Central US:
    host: central-us.database.windows.net
    database: sales1_poc
    gcp_location: us-central1
  Central India:
    host: sql-to-gcp-poc-server2.database.windows.net
    database: sales_poc
    gcp_location: asia-south1      # Mumbai, the closest GCP region to Central India
 
azure:
  storage_account: storageaccount8791511009
  container: migration-staging
  # sas_token / connection string are read from .env — never stored here
  upload:
    # Large batches (e.g. 20 lakh+ rows) produce large Parquet files;
    # the SDK's default timeouts are too short for a slow moment on a
    # constrained network. Raise these if you still see
    # ('Connection aborted.', TimeoutError(...)) at very large batch sizes.
    connection_timeout_seconds: 300
    read_timeout_seconds: 300
    max_block_size_bytes: 8388608   # 8 MB per block
    max_concurrency: 4              # blocks uploaded in parallel
    max_retries: 3
    retry_backoff_seconds: 5        # doubles each retry: 5s, 10s, 20s

gcp:
  project_id: sts-accelerator
  gcs_bucket: migration-landing-bucket
  # Control dataset name. Migrated DATA tables are NOT put directly in
  # this dataset — each source SQL Server schema gets its own dataset
  # named after the schema (`dbo` -> `dbo`, `sales` -> `sales`; with a region,
  # `east_us_dbo`, `east_us_sales` — see
  # src/bigquery/dataset_naming.py), so the source schema structure
  # stays visibly separated in BigQuery instead of being flattened.
  # This name IS used as-is for the shared operational/control
  # tables (migration_pipeline_logs, migration_checkpoint,
  # migration_audit, migration_report), which are not schema-scoped.
  bq_dataset: migrated_data

extraction:
  # Every table is paged by its primary key (keyset pagination), NOT by
  # partitioning on a business column. Each page is written as its own
  # Parquet file (<table>_part0000.parquet, _part0001.parquet, ...) and
  # loaded/merged independently, so a failure partway through a table
  # only has to redo the pages after the last committed checkpoint.
  batch_size: 25000
  # OPTIONAL. Date-based cutoff: only rows whose `updatedAt` column is
  # on/before this date (updatedAt <= cutoff_date) are pulled from the
  # source. Applied to EVERY table this pipeline migrates, regardless
  # of load_mode ("full" and "incremental" alike) — see
  # src/pipeline/table_pipeline.py. Every source table is expected to
  # have an `updatedAt` column; the filter is applied server-side in
  # SQL Server alongside the usual keyset (PK) pagination, so it
  # doesn't disturb resumability.
  # Accepts "YYYY-MM-DD" or a full ISO timestamp. Leave null (or delete
  # this line) to disable the filter and extract every row.
  cutoff_date: 2026-09-22

metadata:
  # Table names for the operational tables this pipeline maintains in
  # BigQuery itself (created automatically if they don't exist — see
  # src/bigquery/bq_control_tables.py):
  log_table: migration_pipeline_logs        # raw per-stage event log, as a queryable table
  checkpoint_table: migration_checkpoint    # last committed PK per table, used to resume failed/partial runs
  audit_table: migration_audit              # one row per table per run — final outcome / row counts
  report_table: migration_report            # one row per table — latest status + live row count (see src/reporting)

overrides_file: config/tables_override.yaml

# OPTIONAL. Where src/planner/table_planner.py writes its auto-generated,
# read-only snapshot of the current dynamic table plan (name, primary key,
# load_mode) every time it runs. Purely informational —
# never read back in — so it's always safe to delete or leave unset
# (defaults to config/tables.yaml).
tables_snapshot_file: config/tables.yaml
